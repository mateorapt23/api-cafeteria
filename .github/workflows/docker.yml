name: Construir y subir imagen Backend Cafetería
on:
  push:
    branches:
      - main
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Construir imagen
        run: docker build -t mateorapt231/api-cafeteria:1.0 .
      - name: Subir imagen
        run: docker push mateorapt231/api-cafeteria:1.0
      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 18.219.154.180
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull mateorapt231/api-cafeteria:1.0
            sudo docker stop api-cafeteria || true
            sudo docker rm api-cafeteria || true
            sudo docker run -d \
              --name api-cafeteria \
              --network cafeteria-net \
              -p 3000:3000 \
              -e PORT=3000 \
              -e DB_HOST=${{ secrets.RDS_HOST }} \
              -e DB_PORT=5432 \
              -e DB_USER=postgres \
              -e DB_PASSWORD=${{ secrets.RDS_PASSWORD }} \
              -e DB_NAME=cafeteria \
              -e DB_SSL=true \
              mateorapt231/api-cafeteria:1.0
